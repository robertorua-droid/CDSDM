<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <title>Centro notifiche 0.4.1</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">
  <h1>Centro notifiche 0.4.1</h1>
  <pre id="out"></pre>

  <script>
    function log(msg){ document.getElementById('out').textContent += msg + "\n"; }
    function assertTrue(cond, msg){ if(!cond){ throw new Error(msg); } log("✓ " + msg); }
    window.getData = function(){ return []; };
  </script>
  <script src="../js/features/scadenziario/scadenziario-service.js"></script>
  <script src="../js/features/accounting/accounting-consistency-service.js"></script>
  <script src="../js/features/accounting/notification-center-service.js"></script>
  <script>
    (function(){
      const data = {
        customers: [{id:'c1', name:'Cliente Demo'}],
        suppliers: [{id:'s1', name:'Fornitore Demo'}],
        products: [{id:'p1', name:'Prodotto sotto scorta', stockQty:1, minStock:5}],
        invoices: [{id:'i1', customerId:'c1', number:'1', dataScadenza:'2026-04-20', totaleDocumento:100, totDoc:100}],
        purchases: [{id:'a1', supplierId:'s1', number:'A1', dataScadenza:'2026-05-10', totaleDocumento:80}],
        customerDDTs: [{id:'d1', customerId:'c1', number:'DDT1', status:'bozza'}],
        customerOrders: [{id:'o1', number:'OC1', status:'aperto'}],
        supplierOrders: [{id:'of1', number:'OF1', status:'aperto'}],
        warehouseLots: [{id:'l1', productId:'p1', lotCode:'LOT1', expiryDate:'2026-05-05'}],
        paymentEvents: [],
        bankReconciliationEvents: [{id:'r1', paymentEventId:'missing', bankDate:'2026-05-01'}],
        cashbookMovements: [],
        businessBudgets: []
      };
      const result = window.NotificationCenterService.buildNotifications(data, {today:'2026-05-01', dueHorizonDays:15, expiryHorizonDays:30});
      assertTrue(result.items.length >= 6, 'genera notifiche da più fonti operative');
      assertTrue(result.summary.danger >= 1, 'classifica almeno una notifica critica');
      assertTrue(result.items.some(n => n.category === 'scadenze'), 'include scadenze');
      assertTrue(result.items.some(n => n.category === 'magazzino'), 'include magazzino');
      assertTrue(result.items.some(n => n.category === 'lotti'), 'include lotti');
      assertTrue(result.items.some(n => n.category === 'documenti'), 'include DDT/documenti');
      assertTrue(result.items.some(n => n.category === 'riconciliazione'), 'include riconciliazioni');
      const filtered = window.NotificationCenterService.buildNotifications(data, {today:'2026-05-01', filters:{category:'magazzino'}});
      assertTrue(filtered.items.every(n => n.category === 'magazzino'), 'filtra per categoria');
      log('OK');
    })();
  </script>
</body>
</html>
