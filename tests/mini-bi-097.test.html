<!doctype html><html lang="it"><head><meta charset="utf-8"><title>CDSDM 0.9.7 - Vista Didattica / Docente e scenari B.I.</title></head><body><h1>Test 0.9.7 - Vista Didattica / Docente e scenari B.I.</h1><pre id="output"></pre><script src="../js/core/domain-constants.js"></script><script src="../js/core/app-store.js"></script><script src="../js/features/bi/mini-bi-service.js"></script><script>const out=document.getElementById('output');function ok(l,c){if(!c)throw new Error(l);out.textContent+='✓ '+l+'\n';}async function read(p){return fetch(p).then(r=>r.text());}async function run(){const a=window.MiniBIService.computeArea('didattica',{customers:[{}],suppliers:[{}],products:[{}]},{}); ok('vista Didattica disponibile', a.title==='Didattica'); ok('domande guida presenti', Array.isArray(a.questions)&&a.questions.length>=3); ok('KPI catalogati nella vista', a.cards.some(c=>c[0].includes('KPI')));out.textContent+='\nOK 0.9.7';}run().catch(e=>{out.textContent+='\nERRORE: '+e.message;throw e;});</script></body></html>
