<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <title>Import CSV 0.2.5 - Test</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">
  <h1 class="h4">Import CSV 0.2.5</h1>
  <div id="results" class="mt-3"></div>

  <script>
    window.globalData = { customers: [], suppliers: [], products: [{ id: '1', description: 'Esistente' }], warehouseLots: [], warehouseMovements: [] };
    window.getData = function (key) { return window.globalData[key] || []; };
  </script>
  <script src="../js/core/domain-normalizers.js"></script>
  <script src="../js/features/import/import-csv-module.js"></script>
  <script>
    const results = document.getElementById('results');
    function assertTrue(condition, message) {
      const div = document.createElement('div');
      div.className = 'alert ' + (condition ? 'alert-success' : 'alert-danger');
      div.textContent = (condition ? 'OK - ' : 'ERRORE - ') + message;
      results.appendChild(div);
      if (!condition) throw new Error(message);
    }

    const csv = 'code;description;itemType;purchasePrice;salePrice;stockQty;trackingMode\nP001;Prodotto demo;product;10,50;18,00;5;lot\n';
    const parsed = window.AppModules.importCsv.parseCsv(csv);
    assertTrue(parsed.headers.length === 7, 'parser CSV riconosce intestazioni con separatore ;');
    assertTrue(parsed.rows.length === 1, 'parser CSV riconosce una riga dati');
    assertTrue(parsed.rows[0].description === 'Prodotto demo', 'parser CSV mappa i campi per nome colonna');

    const preparedProducts = window.AppModules.importCsv.prepareRows('products', parsed.rows);
    assertTrue(preparedProducts.length === 1 && preparedProducts[0].valid, 'prepareRows valida un prodotto fisico completo');
    assertTrue(preparedProducts[0].id === '2', 'ID automatico progressivo evita ID esistenti');
    assertTrue(preparedProducts[0].data.itemType === 'product', 'normalizzazione mantiene itemType product');
    assertTrue(preparedProducts[0].data.trackingMode === 'lot', 'normalizzazione mantiene trackingMode lot');

    const lotCsv = 'productId;lotCode;expiryDate;qtyAvailable\n2;LOT-2026;31/12/2026;3\n';
    const lotRows = window.AppModules.importCsv.parseCsv(lotCsv).rows;
    const preparedLots = window.AppModules.importCsv.prepareRows('warehouseLots', lotRows);
    assertTrue(preparedLots[0].valid, 'prepareRows valida un lotto con prodotto e codice lotto');
    assertTrue(preparedLots[0].data.expiryDate === '2026-12-31', 'conversione data italiana in ISO');

    const badMove = window.AppModules.importCsv.prepareRows('warehouseMovements', [{ productId: '', quantity: '0' }]);
    assertTrue(!badMove[0].valid && badMove[0].errors.length >= 1, 'movimento senza prodotto/quantità positiva viene bloccato');
  </script>
</body>
</html>
