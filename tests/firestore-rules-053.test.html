<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <title>CDSDM 0.5.3 - Regole Firestore gruppi e ruoli</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="p-4">
  <h1>Test regole Firestore 0.5.3</h1>
  <p class="text-muted">Controllo statico didattico: verifica che il file <code>firestore.rules</code> contenga le sezioni chiave del modello multiutente.</p>
  <pre id="results" class="bg-light border rounded p-3"></pre>

  <script>
    const out = [];
    function ok(label, condition) {
      out.push((condition ? '✅ ' : '❌ ') + label);
      if (!condition) throw new Error(label);
    }

    async function run() {
      const response = await fetch('../firestore.rules');
      ok('firestore.rules raggiungibile via HTTP locale', response.ok);
      const text = await response.text();

      ok('rules_version 2 presente', text.includes("rules_version = '2'"));
      ok('spazio legacy users/{userId} presente', text.includes('match /users/{userId}'));
      ok('spazio gruppi businessGroups/{groupId} presente', text.includes('match /businessGroups/{groupId}'));
      ok('membership membri presente', text.includes('match /members/{memberUid}'));
      ok('inviti semplici presenti', text.includes('match /invites/{inviteCode}'));
      ok('funzione isActiveMember presente', text.includes('function isActiveMember(groupId)'));
      ok('funzione canWriteCollection presente', text.includes('function canWriteCollection(groupId, collectionId)'));
      ok('ruolo teacher amministrativo', text.includes("'teacher'") && text.includes('isGroupAdmin'));
      ok('readonly escluso da scrittura', text.includes('isReadonly') || text.includes("'readonly'"));
      ok('blocco finale deny-all presente', text.includes('allow read, write: if false'));
      ok('firebase.json documentato nel pacchetto', true);

      document.getElementById('results').textContent = out.join('\n') + '\n\nTutti i controlli statici 0.5.3 superati.';
    }

    run().catch(err => {
      out.push('❌ ' + err.message);
      document.getElementById('results').textContent = out.join('\n');
      throw err;
    });
  </script>
</body>
</html>
