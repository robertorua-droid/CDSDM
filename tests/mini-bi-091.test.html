<!doctype html><html lang="it"><head><meta charset="utf-8"><title>CDSDM 0.9.1 - Filtri periodo e servizio aggregazioni B.I.</title></head><body><h1>Test 0.9.1 - Filtri periodo e servizio aggregazioni B.I.</h1><pre id="output"></pre><script src="../js/core/domain-constants.js"></script><script src="../js/core/app-store.js"></script><script src="../js/features/bi/mini-bi-service.js"></script><script>const out=document.getElementById('output');function ok(l,c){if(!c)throw new Error(l);out.textContent+='✓ '+l+'\n';}async function read(p){return fetch(p).then(r=>r.text());}async function run(){const data={invoices:[{date:'2026-01-10',total:100},{date:'2025-01-10',total:80}],purchases:[{date:'2026-01-11',total:40}],notes:[],products:[],paymentEvents:[]}; const r=window.MiniBIService.computeOverviewKpis(data,{year:2026}); ok('filtro anno applicato', r.totals.revenueNet===100); const cmp=window.MiniBIService.comparePeriods(data,{year:2026}); ok('confronto periodo disponibile', cmp.deltas.revenueNet.delta===20);out.textContent+='\nOK 0.9.1';}run().catch(e=>{out.textContent+='\nERRORE: '+e.message;throw e;});</script></body></html>
