<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <title>CDSDM 0.6.2 - Profili permesso</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body class="p-4">
  <h1>Test 0.6.2 - Profili permesso configurabili</h1>
  <pre id="out"></pre>
  <script>
    window.AppModules = {};
    window.currentUser = { uid: 'admin_uid', email: 'admin@example.test' };
    window.currentBusinessGroup = {
      id: 'group_demo',
      name: 'Gruppo Demo',
      role: 'sales',
      membership: {
        role: 'sales',
        permissionProfileId: 'sales_limited',
        profilePermissions: {
          customers: 'write',
          sales: 'write',
          invoices: 'read',
          warehouse: 'none',
          accounting: 'read',
          reports: 'read',
          permissions: 'none'
        }
      }
    };
    window.AppStore = { get: () => ({}) };
  </script>
  <script src="../js/core/permissions-policy.js"></script>
  <script src="../js/features/business-groups/permission-profiles-service.js"></script>
  <script>
    const results = [];
    function assert(name, condition) {
      results.push((condition ? '✅ ' : '❌ ') + name);
      if (!condition) throw new Error(name);
    }
    assert('PermissionProfilesService disponibile', !!window.PermissionProfilesService);
    assert('moduli configurabili presenti', window.PermissionProfilesService.MODULES.length >= 10);
    assert('profili predefiniti disponibili', window.PermissionProfilesService.defaultProfiles().length >= 7);
    assert('profilo vendite standard contiene clienti in scrittura', window.PermissionProfilesService.templateProfile('sales').permissions.customers === 'write');
    assert('PermissionsPolicy consente accesso clienti da profilo', window.PermissionsPolicy.canAccessTarget('anagrafica-clienti') === true);
    assert('PermissionsPolicy consente scrittura clienti da profilo', window.PermissionsPolicy.canWrite('customers') === true);
    assert('PermissionsPolicy nega scrittura fatture se profilo è read', window.PermissionsPolicy.canWrite('invoices') === false);
    assert('PermissionsPolicy nasconde magazzino se profilo è none', window.PermissionsPolicy.canAccessTarget('magazzino-giacenze') === false);
    assert('PermissionsPolicy nega profili permesso se profilo permissions none', window.PermissionsPolicy.canAccessTarget('profili-permesso') === false);
    document.getElementById('out').textContent = results.join('\n');
  </script>
</body>
</html>
