<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <title>Test Riconciliazione pagamenti 0.3.5</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">
  <h1>Riconciliazione pagamenti 0.3.5</h1>
  <div id="results" class="mt-3"></div>
  <script src="test-harness.js"></script>
  <script>
    window.globalData = { customers: [], suppliers: [], invoices: [], purchases: [], paymentEvents: [], bankReconciliationEvents: [] };
    window.getData = function (key) { return window.globalData[key]; };
  </script>
  <script src="../js/features/accounting/payment-events-service.js"></script>
  <script src="../js/features/accounting/bank-reconciliation-service.js"></script>
  <script>
    const t = new TestHarness('results');

    t.test('parse CSV banca con importi entrata/uscita', function () {
      const csv = 'data;dataValuta;importo;conto;riferimento;descrizione\n01/05/2026;01/05/2026;1220,00;Banca;TRN1;Bonifico cliente Rossi fattura 12\n02/05/2026;02/05/2026;-610,00;Banca;TRN2;Pagamento fornitore Bianchi acquisto 7';
      const rows = BankReconciliationService.parseCsv(csv);
      t.assertEqual(rows.length, 2, 'righe importate');
      t.assertEqual(rows[0].direction, 'in', 'entrata');
      t.assertEqual(rows[1].direction, 'out', 'uscita');
      t.assertEqual(rows[0].amount, 1220, 'importo normalizzato');
    });

    t.test('proposta match fattura cliente aperta', function () {
      const data = {
        customers: [{ id: 'c1', name: 'Rossi SRL' }], suppliers: [],
        invoices: [{ id: 'i1', customerId: 'c1', number: '12', date: '2026-04-20', dataScadenza: '2026-05-01', nettoDaPagare: 1220 }],
        purchases: [], paymentEvents: [], bankReconciliationEvents: []
      };
      const rows = BankReconciliationService.suggestMatches(BankReconciliationService.parseCsv('data;importo;descrizione\n2026-05-01;1220;Bonifico Rossi SRL fattura 12'), data);
      t.assert(rows[0].suggested, 'match suggerito');
      t.assertEqual(rows[0].suggested.documentId, 'i1', 'documento abbinato');
      t.assert(rows[0].suggested.score >= 60, 'score significativo');
    });

    t.test('crea evento pagamento da riconciliazione', function () {
      const row = BankReconciliationService.normalizeBankRow({ data: '2026-05-01', importo: '1220', conto: 'Banca', riferimento: 'TRN1', descrizione: 'Fattura 12' });
      const candidate = { subjectType: 'customer', subjectId: 'c1', subjectName: 'Rossi SRL', documentType: 'invoice', documentId: 'i1', number: '12', residual: 1220, allocationAmount: 1220 };
      const ev = BankReconciliationService.buildPaymentEventFromMatch(row, candidate, {});
      t.assertEqual(ev.type, 'customer_receipt', 'tipo evento');
      t.assertEqual(ev.allocations[0].documentId, 'i1', 'allocazione documento');
      const reco = BankReconciliationService.buildReconciliationEvent(row, candidate, ev);
      t.assertEqual(reco.bankRowHash, row.rowHash, 'hash riga bancaria');
      t.assertEqual(reco.paymentEventId, ev.id, 'collegamento paymentEvent');
    });

    t.run();
  </script>
</body>
</html>
