<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Test UX operativa 0.12.13</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-4">
  <h1 class="h3">UX operativa 0.12.13</h1>
  <p class="text-muted">Verifica conversione preventivi approvati, quantità e layout Segnalazioni operative.</p>
  <div id="results" class="list-group"></div>
</main>
<script>
(function(){
  const out=document.getElementById('results');
  function row(ok,label,detail){ const el=document.createElement('div'); el.className='list-group-item '+(ok?'list-group-item-success':'list-group-item-danger'); el.innerHTML='<strong>'+(ok?'OK':'KO')+'</strong> '+label+(detail?'<div class="small text-muted">'+detail+'</div>':''); out.appendChild(el); }
  function fetchText(path){ return fetch(path).then(r=>r.text()); }
  Promise.all([fetchText('../index.html'), fetchText('../js/features/warehouse/quotes-module.js'), fetchText('../js/features/operations/operational-reports-module.js'), fetchText('../js/features/invoices/invoices-form-module.js')]).then(([html,quotes,ops,invoices])=>{
    row(html.indexOf('operationalReportsTabs')>=0 && html.indexOf('operational-reports-list-pane')>=0 && html.indexOf('operational-reports-new-pane')>=0, 'Segnalazioni operative separate in tab elenco/form');
    row(html.indexOf('id="quote-lineQty" type="number" min="0" step="1" inputmode="decimal"')>=0, 'Quantità preventivo con incremento unitario e decimali manuali ammessi');
    row(html.indexOf('id="customerOrder-lineQty" type="number" min="0" step="1" inputmode="decimal"')>=0, 'Quantità ordine cliente con step 1');
    row(html.indexOf('id="supplierOrder-lineQty" type="number" min="0" step="1" inputmode="decimal"')>=0, 'Quantità ordine fornitore con step 1');
    row(invoices.indexOf('step="1" inputmode="decimal" class="form-control form-control-sm text-end line-qty"')>=0, 'Righe fattura con quantità a incremento unitario');
    row(quotes.indexOf('isQuoteApprovedForOrder')>=0 && quotes.indexOf('Approva il preventivo in Analisi')>=0 && quotes.indexOf('Crea ordine cliente')>=0 || html.indexOf('Crea ordine cliente')>=0, 'Conversione preventivo → ordine vincolata ad approvazione/accettazione');
    row(ops.indexOf('activateListTab')>=0 && ops.indexOf('layout elenco/form in tab')>=0, 'Modulo segnalazioni ritorna all’elenco dopo salvataggio/invio');
  }).catch(e=>row(false,'Eccezione test',e.message||e));
})();
</script>
</body>
</html>
