<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <title>Incassi e pagamenti 0.3.1 - Test</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">
  <h1>Incassi e pagamenti 0.3.1</h1>
  <pre id="out" class="border rounded p-3 bg-light"></pre>
  <script src="../js/features/accounting/payment-events-service.js"></script>
  <script>
    const out = document.getElementById('out');
    const logs = [];
    function assertTrue(cond, msg) { if (!cond) throw new Error(msg); logs.push('✓ ' + msg); }
    function assertEq(a, b, msg) { if (a !== b) throw new Error(msg + ' (atteso ' + b + ', ottenuto ' + a + ')'); logs.push('✓ ' + msg); }
    try {
      const data = {
        customers: [{ id: 'c1', name: 'Cliente Uno' }],
        suppliers: [{ id: 's1', name: 'Fornitore Uno' }],
        invoices: [{ id: 'i1', customerId: 'c1', number: '10', date: '2026-01-01', dataScadenza: '2026-01-31', nettoDaPagare: 100 }],
        purchases: [{ id: 'p1', supplierId: 's1', number: 'A1', date: '2026-01-02', dataScadenza: '2026-02-01', totaleDocumento: 80 }],
        paymentEvents: []
      };
      const docs = PaymentEventsService.buildOpenDocuments('customer', 'c1', data);
      assertEq(docs.length, 1, 'trova una fattura cliente aperta');
      assertEq(docs[0].residual, 100, 'residuo fattura iniziale');
      const plan = PaymentEventsService.buildSavePlan({
        id: 'ev1', type: 'customer_receipt', subjectType: 'customer', subjectId: 'c1', date: '2026-01-15', amount: 60,
        method: 'Bonifico', allocations: [{ documentType: 'invoice', documentId: 'i1', documentNumber: '10', amount: 60 }]
      }, data);
      assertEq(plan.event.allocations.length, 1, 'mantiene allocazione evento');
      assertEq(plan.docUpdates.length, 1, 'prepara aggiornamento documento allocato');
      assertEq(plan.docUpdates[0].data.paymentStatus, 'Parziale', 'marca documento come parziale');
      data.paymentEvents = [plan.event];
      const events = PaymentEventsService.buildEvents(data, { includeLegacy: true });
      assertEq(events.length, 1, 'legge evento paymentEvents');
      const summary = PaymentEventsService.summarize(events);
      assertEq(summary.customerReceipts, 60, 'riepiloga incassi cliente');
      let failed = false;
      try { PaymentEventsService.buildSavePlan({ amount: 10, allocations: [{ documentType: 'invoice', documentId: 'i1', amount: 20 }] }, data); } catch (e) { failed = true; }
      assertTrue(failed, 'blocca allocazioni superiori al movimento');
      out.textContent = logs.join('\n') + '\n\nOK';
      out.classList.add('text-success');
    } catch (e) {
      out.textContent = 'ERRORE: ' + e.message + '\n' + logs.join('\n');
      out.classList.add('text-danger');
      throw e;
    }
  </script>
</body>
</html>
