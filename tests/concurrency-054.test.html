<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <title>CDSDM 0.5.4 - Concorrenza e scritture sicure</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="p-4">
  <h1>Test 0.5.4 - Concorrenza e scritture sicure</h1>
  <pre id="out" class="bg-light border p-3"></pre>

  <script src="../js/core/concurrency-service.js"></script>
  <script>
    const out = document.getElementById('out');
    const rows = [];
    function ok(label, condition) {
      rows.push((condition ? '✅ ' : '❌ ') + label);
      if (!condition) throw new Error(label);
    }

    window.currentUser = { uid: 'u_test', email: 'test@example.local' };
    window.currentBusinessGroup = { id: 'grp_test', name: 'Gruppo test' };

    ok('ConcurrencyService esposto', !!window.ConcurrencyService);
    ok('Versione servizio 0.5.4', window.ConcurrencyService.VERSION === '0.5.4');

    const base = window.ConcurrencyService.addWriteMetadata({ name: 'Documento' }, null, {});
    ok('createdAt aggiunto', !!base.createdAt);
    ok('createdBy aggiunto', base.createdBy === 'u_test');
    ok('updatedAt aggiunto', !!base.updatedAt);
    ok('updatedBy aggiunto', base.updatedBy === 'u_test');
    ok('docVersion iniziale = 1', base.docVersion === 1);
    ok('businessGroupId aggiunto in modalità gruppo', base.businessGroupId === 'grp_test');

    const update = window.ConcurrencyService.addWriteMetadata({ name: 'Documento aggiornato', _expectedDocVersion: 1 }, { docVersion: 1 }, {});
    ok('campi tecnici input rimossi', update._expectedDocVersion === undefined);
    ok('docVersion incrementato', update.docVersion === 2);
    ok('writePolicyVersion impostata', update.writePolicyVersion === '0.5.4');

    ok('TTL lock predefinito esposto', window.ConcurrencyService.DEFAULT_LOCK_TTL_MS > 0);

    out.textContent = rows.join('\n') + '\n\nTest completato.';
  </script>
</body>
</html>
