<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <title>CDSDM 0.6.1 - Inviti avanzati e onboarding</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="p-4">
  <h1>Test 0.6.1 - Inviti avanzati e onboarding</h1>
  <pre id="results"></pre>
  <div id="business-group-sidebar"></div>
  <select id="business-group-selector"></select>
  <div id="business-groups-root"></div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="../js/features/business-groups/business-groups-service.js"></script>
  <script src="../js/features/business-groups/business-groups-module.js"></script>
  <script>
    const out = [];
    function ok(name, cond) { out.push((cond ? '✓ ' : '✗ ') + name); if (!cond) throw new Error(name); }
    try {
      ok('BusinessGroupsService esposto', !!window.BusinessGroupsService);
      ok('Versione BusinessGroupsService 0.6.x', /^0\.6\./.test(window.BusinessGroupsService.VERSION));
      ok('Ruoli esposti', !!window.BusinessGroupsService.ROLES.admin && !!window.BusinessGroupsService.ROLES.teacher);
      ok('generateInviteCode formato atteso', /^BG-[A-Z0-9]{4}-[A-Z0-9]{4}$/.test(window.BusinessGroupsService.generateInviteCode()));
      ok('revokeInvite esposto', typeof window.BusinessGroupsService.revokeInvite === 'function');
      ok('regenerateInviteCode esposto', typeof window.BusinessGroupsService.regenerateInviteCode === 'function');
      ok('cleanupExpiredInvites esposto', typeof window.BusinessGroupsService.cleanupExpiredInvites === 'function');
      ok('effectiveInviteStatus esposto', typeof window.BusinessGroupsService.effectiveInviteStatus === 'function');
      ok('effectiveInviteStatus pending', window.BusinessGroupsService.effectiveInviteStatus({ status: 'pending', expiresAt: new Date(Date.now() + 86400000) }) === 'pending');
      ok('effectiveInviteStatus expired', window.BusinessGroupsService.effectiveInviteStatus({ status: 'pending', expiresAt: new Date(Date.now() - 86400000) }) === 'expired');
      ok('Modulo UI Gruppi esposto', window.AppModules && window.AppModules.businessGroups && typeof window.AppModules.businessGroups.render === 'function');
      document.getElementById('results').textContent = out.join('\n') + '\n\nTutti i controlli statici 0.6.1 superati.';
    } catch (e) {
      document.getElementById('results').textContent = out.join('\n') + '\n✗ ' + e.message;
      throw e;
    }
  </script>
</body>
</html>
