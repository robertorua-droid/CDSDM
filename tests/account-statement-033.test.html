<!doctype html>
<html lang="it">
<head><meta charset="utf-8"><title>Estratto conto 0.3.3 - Test</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="p-4"><h1>Estratto conto 0.3.3</h1><pre id="out"></pre>
<script>
function log(m){document.getElementById('out').textContent+=m+'\n'}
function assertEq(actual, expected, msg){ if (Math.round(Number(actual)*100)!==Math.round(Number(expected)*100)) throw new Error(msg+' atteso '+expected+' ottenuto '+actual); log('✓ '+msg); }
window.globalData = { customers: [{id:'c1', name:'Cliente Demo'}], suppliers: [{id:'s1', name:'Fornitore Demo'}] };
</script>
<script src="../js/features/accounting/ledger-service.js"></script>
<script src="../js/features/accounting/payment-events-service.js"></script>
<script src="../js/features/accounting/account-statement-service.js"></script>
<script>
(function(){
  const data = {
    customers: [{id:'c1', name:'Cliente Demo'}], suppliers: [{id:'s1', name:'Fornitore Demo'}],
    invoices: [
      {id:'i0', customerId:'c1', number:'1', date:'2026-01-05', total:100},
      {id:'i1', customerId:'c1', number:'2', date:'2026-02-10', total:200, payments:[{id:'p1', date:'2026-02-20', amount:50}]},
      {id:'i2', customerId:'c1', number:'NC1', date:'2026-02-25', total:30, isCreditNote:true}
    ], purchases: [], paymentEvents: []
  };
  const result = AccountStatementService.buildStatement(data, {subjectType:'customer', subjectId:'c1', from:'2026-02-01', to:'2026-02-28'});
  assertEq(result.summary.openingBalance, 100, 'saldo iniziale cliente prima del periodo');
  assertEq(result.summary.debit, 200, 'dare periodo cliente');
  assertEq(result.summary.credit, 80, 'avere periodo cliente');
  assertEq(result.summary.closingBalance, 220, 'saldo finale cliente');
  if (result.entries.length !== 3) throw new Error('attesi 3 movimenti di periodo');
  log('✓ movimenti di periodo filtrati correttamente');
  const supplier = AccountStatementService.buildStatement({customers:[], suppliers:[{id:'s1', name:'Fornitore Demo'}], invoices:[], purchases:[{id:'a1', supplierId:'s1', number:'A1', date:'2026-03-01', total:500, payments:[{date:'2026-03-05', amount:125}]}], paymentEvents:[]}, {subjectType:'supplier', subjectId:'s1'});
  assertEq(supplier.summary.credit, 500, 'avere fornitore da acquisto');
  assertEq(supplier.summary.debit, 125, 'dare fornitore da pagamento');
  assertEq(supplier.summary.closingBalance, 375, 'saldo finale fornitore');
  log('OK');
})();
</script></body></html>
