<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>CDSDM 0.5.2 - Permessi UI Gruppi aziendali</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">
  <h1>Test permessi UI 0.5.2</h1>
  <pre id="results" class="bg-light border rounded p-3"></pre>

  <div class="sidebar d-none">
    <ul>
      <li><a class="nav-link" data-target="preventivi" href="#">Preventivi</a></li>
      <li><a class="nav-link" data-target="prima-nota" href="#">Prima nota</a></li>
      <li><a class="nav-link" data-target="magazzino-movimenti" href="#">Movimenti</a></li>
      <li><a class="nav-link" data-target="gruppi-aziendali" href="#">Gruppi</a></li>
    </ul>
  </div>
  <p id="user-name-sidebar"></p>
  <section id="preventivi" class="content-section"><button id="save-quote-btn">Salva</button></section>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="../js/core/permissions-policy.js"></script>
  <script>
    const out = [];
    function ok(label, condition) {
      out.push((condition ? '✅ ' : '❌ ') + label);
      if (!condition) throw new Error(label);
    }

    window.currentBusinessGroup = { id: 'group-demo', role: 'sales', groupName: 'Demo' };
    ok('versione PermissionsPolicy ramo 0.5.x', /^(0\.5\.[2-9]|0\.6\.[0-9]|0\.7\.[0-9])$/.test(window.PermissionsPolicy.VERSION));
    ok('sales accede ai preventivi', window.PermissionsPolicy.canAccessTarget('preventivi') === true);
    ok('sales non accede alla prima nota', window.PermissionsPolicy.canAccessTarget('prima-nota') === false);
    ok('sales scrive area vendite', window.PermissionsPolicy.canWrite('sales') === true);
    ok('sales non scrive contabilità', window.PermissionsPolicy.canWrite('accounting') === false);

    window.currentBusinessGroup = { id: 'group-demo', role: 'readonly', groupName: 'Demo' };
    ok('readonly legge elenco fatture', window.PermissionsPolicy.canAccessTarget('elenco-fatture') === true);
    ok('readonly non scrive fatture', window.PermissionsPolicy.canWrite('invoices') === false);
    window.PermissionsPolicy.applyUiRestrictions();
    ok('readonly disabilita pulsante salvataggio', document.getElementById('save-quote-btn').disabled === true);

    window.currentBusinessGroup = { id: 'group-demo', role: 'teacher', groupName: 'Demo' };
    ok('teacher è amministratore didattico', window.PermissionsPolicy.isAdmin() === true);
    ok('teacher accede a tutte le sezioni', window.PermissionsPolicy.canAccessTarget('avanzate') === true);

    document.getElementById('results').textContent = out.join('\n') + '\n\nTutti i controlli statici 0.5.2 superati.';
  </script>
</body>
</html>
