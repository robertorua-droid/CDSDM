<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <title>Ruoli e permessi 0.2.6 - Test</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">
  <h1 class="h4">Ruoli e permessi 0.2.6</h1>
  <div id="results" class="mt-3"></div>
  <ul class="sidebar d-none">
    <li><a class="nav-link" data-target="dashboard">Dashboard</a></li>
    <li><a class="nav-link" data-target="import-massivi">Import</a></li>
    <li><a class="nav-link" data-target="ruoli-permessi">Ruoli</a></li>
  </ul>
  <p id="user-name-sidebar"></p>
  <button id="saveDemo">Salva</button>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script>
    window.globalData = { companyInfo: { accessControl: { enabled: true, activeRole: 'commerciale' } } };
    window.getData = function (key) { return window.globalData[key]; };
  </script>
  <script src="../js/core/permissions-policy.js"></script>
  <script>
    const results = document.getElementById('results');
    function assertTrue(condition, message) {
      const div = document.createElement('div');
      div.className = 'alert ' + (condition ? 'alert-success' : 'alert-danger');
      div.textContent = (condition ? 'OK - ' : 'ERRORE - ') + message;
      results.appendChild(div);
      if (!condition) throw new Error(message);
    }

    assertTrue(window.PermissionsPolicy.getCurrentRole().id === 'commerciale', 'lettura ruolo commerciale da companyInfo.accessControl');
    assertTrue(window.PermissionsPolicy.canAccessTarget('preventivi'), 'commerciale accede ai preventivi');
    assertTrue(!window.PermissionsPolicy.canAccessTarget('import-massivi'), 'commerciale non accede agli import massivi');

    window.globalData.companyInfo.accessControl.activeRole = 'readonly';
    assertTrue(window.PermissionsPolicy.isReadOnly(), 'ruolo sola lettura riconosciuto');
    assertTrue(!window.PermissionsPolicy.canWrite('warehouse'), 'sola lettura non può scrivere');

    window.globalData.companyInfo.accessControl.enabled = false;
    assertTrue(window.PermissionsPolicy.getCurrentRole().id === 'admin', 'controlli disabilitati ricadono su Admin compatibile');
  </script>
</body>
</html>
