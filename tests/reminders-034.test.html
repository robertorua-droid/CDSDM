<!doctype html>
<html lang="it">
<head><meta charset="utf-8"><title>Test solleciti 0.3.4</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="p-4">
<h1 class="h4">Solleciti e promemoria scadenze 0.3.4</h1>
<pre id="out" class="border rounded p-3 bg-light"></pre>
<script>
window.globalData = { customers: [], suppliers: [], invoices: [], purchases: [], paymentEvents: [], reminderEvents: [] };
function getData(k){ return window.globalData[k] || []; }
function assertTrue(cond, msg){ if(!cond) throw new Error(msg || 'assertTrue failed'); }
function assertEq(a,b,msg){ if(a!==b) throw new Error((msg||'assertEq failed') + ': ' + a + ' !== ' + b); }
function log(msg){ document.getElementById('out').textContent += msg + '\n'; }
</script>
<script src="../js/features/scadenziario/scadenziario-service.js"></script>
<script src="../js/features/accounting/reminder-service.js"></script>
<script>
(function(){
  const data = {
    customers: [{ id: 'c1', name: 'Cliente Alfa' }],
    suppliers: [{ id: 's1', name: 'Fornitore Beta' }],
    invoices: [{ id: 'i1', customerId: 'c1', number: 'F-1', date: '2026-01-01', dueDate: '2026-01-31', total: 1000, payments: [{ amount: 200, date: '2026-02-01' }] }],
    purchases: [{ id: 'p1', supplierId: 's1', number: 'A-1', date: '2026-02-01', dueDate: '2026-02-28', total: 300, payments: [] }],
    reminderEvents: [{ id: 'r1', subjectType: 'customer', subjectId: 'c1', documentType: 'invoice', documentId: 'i1', date: '2026-03-10', level: 'secondo', message: 'Sollecito già inviato' }]
  };
  const items = ReminderService.buildItems(data, { today: '2026-04-05', status: 'overdue', subjectType: 'all' });
  assertEq(items.length, 2, 'due scadenze scadute');
  const invoice = items.find(x => x.documentId === 'i1');
  assertTrue(invoice, 'fattura presente');
  assertEq(invoice.residualAmount, 800, 'residuo fattura');
  assertEq(invoice.reminderCount, 1, 'storico sollecito collegato');
  assertEq(invoice.reminderLevel, 'terzo', 'livello per ritardo oltre 60 giorni');
  const summary = ReminderService.summarize(items);
  assertEq(summary.count, 2, 'riepilogo count');
  assertEq(summary.reminded, 1, 'riepilogo già sollecitate');
  const text = ReminderService.buildReminderText(invoice, { companyInfo: { name: 'Studio Demo' } });
  assertTrue(text.indexOf('Cliente Alfa') >= 0, 'testo contiene soggetto');
  assertTrue(text.indexOf('800,00') >= 0, 'testo contiene residuo');
  const event = ReminderService.buildReminderEvent(invoice, text, { date: '2026-04-05', channel: 'pec', status: 'inviato' });
  assertEq(event.documentId, 'i1', 'evento collegato al documento');
  assertEq(event.channel, 'pec', 'canale evento');
  log('OK - Solleciti 0.3.4');
})();
</script>
</body></html>
