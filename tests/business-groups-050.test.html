<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <title>CDSDM 0.5.0 - Gruppi aziendali</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="p-4">
  <h1>Test Gruppi aziendali 0.5.0</h1>
  <pre id="results"></pre>
  <div id="business-group-sidebar"></div>
  <select id="business-group-selector"></select>
  <div id="business-groups-root"></div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="../js/core/utils.js"></script>
  <script src="../js/features/business-groups/business-groups-service.js"></script>
  <script src="../js/features/business-groups/business-groups-module.js"></script>
  <script>
    const out = [];
    function ok(name, cond) { out.push((cond ? '✓ ' : '✗ ') + name); if (!cond) throw new Error(name); }

    ok('DATA_COLLECTIONS include collezioni contabili e audit', Array.isArray(window.CDSDM_DATA_COLLECTIONS) && window.CDSDM_DATA_COLLECTIONS.includes('paymentEvents') && window.CDSDM_DATA_COLLECTIONS.includes('auditEvents'));
    ok('BusinessGroupsService esposto', !!window.BusinessGroupsService);
    ok('Ruoli previsti disponibili', window.BusinessGroupsService.ROLES.admin === 'Amministratore' && window.BusinessGroupsService.ROLES.teacher.indexOf('Docente') === 0);
    ok('Helper root dati esposto', typeof window.getDataRootRef === 'function');
    ok('Modulo UI esposto', window.AppModules && window.AppModules.businessGroups && typeof window.AppModules.businessGroups.bind === 'function');

    window.currentBusinessGroup = { id: 'grp_test', name: 'Alfa S.r.l.', role: 'admin' };
    window.BusinessGroupsService.updateSidebarBadge();
    ok('Sidebar mostra gruppo attivo', document.getElementById('business-group-sidebar').textContent.includes('Alfa S.r.l.'));
    ok('Sidebar mostra ruolo', document.getElementById('business-group-sidebar').textContent.includes('Amministratore'));

    document.getElementById('results').textContent = out.join('\n') + '\n\nTutti i controlli statici 0.5.0 superati.';
  </script>
</body>
</html>
