<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <title>CDSDM 0.5.5 - Console docente</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="p-4">
  <h1>Test 0.5.5 - Console docente e simulazioni</h1>
  <pre id="out" class="bg-light border p-3"></pre>

  <script>
    window.globalData = {
      customers: [{ id: 'c1' }], suppliers: [{ id: 's1' }], products: [{ id: 'p1' }, { id: 'p2' }],
      invoices: [{ id: 'i1' }], purchases: [], warehouseMovements: [{ id: 'm1' }],
      workflowEvents: [], auditEvents: []
    };
    window.CDSDM_DATA_COLLECTIONS = ['customers','suppliers','products','invoices','purchases','warehouseMovements','workflowEvents','auditEvents','teachingScenarios','simulationEvents'];
    window.currentUser = { uid: 'teacher_1', email: 'teacher@example.local' };
    window.currentBusinessGroup = { id: 'grp_demo', name: 'Gruppo Demo', role: 'teacher' };
    window.PermissionsPolicy = { getCurrentRole: function () { return { id: 'teacher' }; } };
  </script>
  <script src="../js/features/business-groups/teacher-console-service.js"></script>
  <script>
    const out = document.getElementById('out');
    const rows = [];
    function ok(label, condition) {
      rows.push((condition ? '✅ ' : '❌ ') + label);
      if (!condition) throw new Error(label);
    }

    ok('TeacherConsoleService esposto', !!window.TeacherConsoleService);
    ok('Versione servizio ramo 0.5.x', /^0\.5\.[5-9]$/.test(window.TeacherConsoleService.VERSION));
    ok('Template ciclo vendite presente', !!window.TeacherConsoleService.SCENARIO_TEMPLATES.ciclo_vendite);
    ok('Console docente consentita al ruolo teacher', window.TeacherConsoleService.canUseTeacherConsole() === true);

    const report = window.TeacherConsoleService.buildProgressReport({
      groupId: 'grp_demo', groupName: 'Gruppo Demo', activeMembers: 4, pendingInvites: 1,
      scenarios: [{ status: 'active' }, { status: 'completed' }], activeScenarios: 1, completedScenarios: 1,
      collectionStats: { customers: 1, suppliers: 1, products: 2, invoices: 1, purchases: 0, warehouseMovements: 1, auditEvents: 0, workflowEvents: 0 }
    });
    ok('Report mantiene groupId', report.groupId === 'grp_demo');
    ok('Report include conteggi chiave', report.keyCounters.products === 2 && report.keyCounters.invoices === 1);
    ok('Report include scenari', report.scenariosTotal === 2 && report.activeScenarios === 1 && report.completedScenarios === 1);

    window.PermissionsPolicy = { getCurrentRole: function () { return { id: 'sales' }; } };
    ok('Console docente negata a sales', window.TeacherConsoleService.canUseTeacherConsole() === false);

    out.textContent = rows.join('\n') + '\n\nTest completato.';
  </script>
</body>
</html>
