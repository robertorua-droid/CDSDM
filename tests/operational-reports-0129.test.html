<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Test Segnalazioni operative 0.12.9</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-4">
  <h1 class="h3">Segnalazioni operative 0.12.9</h1>
  <p class="text-muted">Verifica invio segnalazione, comunicazioni interne e transizioni workflow guidate.</p>
  <div id="results" class="list-group"></div>
</main>
<script>
window.globalData = { operationalReports: [] };
window.AppStore = { get: function(k){ return window.globalData[k]; }, set: function(k,v){ window.globalData[k]=v; } };
window.currentUser = { uid: 'u1', email: 'tester@example.com' };
window.PermissionsPolicy = { canWrite: function(){ return true; }, canAdmin: function(){ return true; }, isAdmin: function(){ return true; } };
</script>
<script src="../js/features/operations/operational-reports-service.js"></script>
<script>
(async function(){
  const out = document.getElementById('results');
  function row(ok, label, detail){ const item=document.createElement('div'); item.className='list-group-item '+(ok?'list-group-item-success':'list-group-item-danger'); item.innerHTML='<strong>'+(ok?'OK':'KO')+'</strong> '+label+(detail?'<div class="small text-muted">'+detail+'</div>':''); out.appendChild(item); }
  try {
    const svc = window.OperationalReportsService;
    row(!!svc && !!svc.submitReport && !!svc.workflowAction, 'Servizio 0.12.9 disponibile');
    const draft = await svc.submitReport({ type:'quarantine_goods', title:'Merce in quarantena', originArea:'warehouse', targetArea:'purchases', severity:'high', actionRequired:'Verificare con il fornitore' }, 'draft');
    row(draft.status === 'draft' && draft.messages.length === 0, 'Salva bozza non invia comunicazioni', draft.code);
    const sent = await svc.workflowAction(draft.id, 'send', 'Merce ricevuta e messa in quarantena: verificare DDT fornitore.');
    row(sent.status === 'reported' && sent.messages.length === 1 && !!sent.reportedAt, 'Bozza trasformata in segnalazione effettiva');
    const msg = await svc.addMessage(sent.id, 'Acquisti prende visione e contatta il fornitore.', 'purchases');
    row(msg.messages.length === 2 && msg.messages[1].area === 'purchases', 'Invia comunicazione interna al reparto');
    const assigned = await svc.workflowAction(msg.id, 'take_charge', 'Segnalazione presa in carico.');
    row(assigned.status === 'assigned' && !!assigned.takenInChargeAt, 'Presa in carico guidata');
    const qa = svc.runQa();
    row(qa.passed, 'QA locale servizio', JSON.stringify(qa));
  } catch(e) { row(false, 'Eccezione test', e.message || e); }
})();
</script>
</body>
</html>
