<!doctype html><html lang="it"><head><meta charset="utf-8"><title>CDSDM 0.9.0 - Fondazione mini B.I.: architettura, catalogo KPI e pagina introduttiva</title></head><body><h1>Test 0.9.0 - Fondazione mini B.I.: architettura, catalogo KPI e pagina introduttiva</h1><pre id="output"></pre><script src="../js/core/domain-constants.js"></script><script src="../js/core/app-store.js"></script><script src="../js/features/bi/mini-bi-service.js"></script><script>const out=document.getElementById('output');function ok(l,c){if(!c)throw new Error(l);out.textContent+='✓ '+l+'\n';}async function read(p){return fetch(p).then(r=>r.text());}async function run(){ok('servizio MiniBIService presente', !!window.MiniBIService); const c=window.MiniBIService.buildKpiCatalog(); ok('catalogo KPI disponibile', Array.isArray(c)&&c.length>=6); const html=await read('../index.html'); ok('voce menu Mini B.I. presente', html.includes('data-target="mini-bi"')); ok('sezione mini-bi presente', html.includes('id="mini-bi"'));out.textContent+='\nOK 0.9.0';}run().catch(e=>{out.textContent+='\nERRORE: '+e.message;throw e;});</script></body></html>
