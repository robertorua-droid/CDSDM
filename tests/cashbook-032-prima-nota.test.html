<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <title>Prima nota 0.3.2 - Test</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">
  <h1>Prima nota / movimenti finanziari 0.3.2</h1>
  <pre id="out" class="border rounded p-3 bg-light"></pre>
  <script src="../js/features/accounting/payment-events-service.js"></script>
  <script src="../js/features/accounting/cashbook-service.js"></script>
  <script>
    const out = document.getElementById('out');
    const logs = [];
    function assertTrue(cond, msg) { if (!cond) throw new Error(msg); logs.push('✓ ' + msg); }
    function assertEq(a, b, msg) { if (a !== b) throw new Error(msg + ' (atteso ' + b + ', ottenuto ' + a + ')'); logs.push('✓ ' + msg); }
    try {
      const data = {
        customers: [{ id: 'c1', name: 'Cliente Uno' }],
        suppliers: [{ id: 's1', name: 'Fornitore Uno' }],
        invoices: [{ id: 'i1', customerId: 'c1', number: 'F1', nettoDaPagare: 100 }],
        purchases: [{ id: 'p1', supplierId: 's1', number: 'A1', totaleDocumento: 40 }],
        paymentEvents: [
          { id: 'e1', type: 'customer_receipt', subjectType: 'customer', subjectId: 'c1', date: '2026-01-10', amount: 100, method: 'Banca', allocations: [{ documentType: 'invoice', documentId: 'i1', amount: 100 }] },
          { id: 'e2', type: 'supplier_payment', subjectType: 'supplier', subjectId: 's1', date: '2026-01-11', amount: 40, method: 'Banca', allocations: [{ documentType: 'purchase', documentId: 'p1', amount: 40 }] }
        ],
        cashbookMovements: [
          { id: 'm1', date: '2026-01-12', direction: 'out', account: 'Cassa', category: 'Cancelleria', amount: 10, description: 'Spesa manuale' },
          { id: 'm2', date: '2026-01-13', direction: 'in', account: 'Cassa', category: 'Rimborso', amount: 5 }
        ]
      };

      const automatic = CashbookService.buildAutomaticMovements(data);
      assertEq(automatic.length, 2, 'genera movimenti automatici da paymentEvents');
      assertEq(automatic[0].direction, 'in', 'incasso cliente come entrata');
      assertEq(automatic[1].direction, 'out', 'pagamento fornitore come uscita');

      const movements = CashbookService.buildMovements(data, {});
      assertEq(movements.length, 4, 'unisce movimenti automatici e manuali');
      const summary = CashbookService.summarize(movements);
      assertEq(summary.income, 105, 'calcola entrate totali');
      assertEq(summary.expense, 50, 'calcola uscite totali');
      assertEq(summary.balance, 55, 'calcola saldo periodo');
      assertTrue(summary.accounts.length >= 2, 'riepiloga saldi per conto');

      const filtered = CashbookService.buildMovements(data, { direction: 'out' });
      assertEq(filtered.length, 2, 'filtra uscite');

      const manual = CashbookService.createManualMovement({ date: '2026-01-20', direction: 'out', account: 'Banca', category: 'Spese bancarie', amount: '12,50' });
      assertEq(manual.amount, 12.5, 'normalizza importo manuale con virgola');
      assertEq(manual.source, 'manual-cashbook', 'marca origine manuale');

      out.textContent = logs.join('\n') + '\n\nTutti i test Prima nota 0.3.2 superati.';
    } catch (e) {
      out.textContent = logs.join('\n') + '\n\nERRORE: ' + e.message;
      out.classList.remove('bg-light');
      out.classList.add('bg-danger-subtle');
      throw e;
    }
  </script>
</body>
</html>
