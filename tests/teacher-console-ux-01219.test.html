<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <title>CDSDM 0.12.19 - UX Console docente</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="p-4">
  <h1>Test 0.12.19 — UX Console docente</h1>
  <div id="teacher-console-root"></div>
  <pre id="out" class="bg-light border p-3 mt-3"></pre>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script>
    const out = document.getElementById('out');
    function ok(label, cond) { out.textContent += (cond ? '✅ ' : '❌ ') + label + '\n'; if (!cond) throw new Error(label); }
    window.currentBusinessGroup = { id: 'grp_demo', name: 'Gruppo Demo', role: 'teacher' };
    window.TeacherConsoleService = {
      PATCH_VERSION: '0.12.19',
      SCENARIO_TEMPLATES: { ciclo_vendite: { title: 'Simulazione ciclo vendite', area: 'Vendite' } },
      canUseTeacherConsole: () => true,
      getDashboard: async () => ({ groupId:'grp_demo', groupName:'Gruppo Demo', activeMembers:2, pendingInvites:0, activeScenarios:1, collectionStats:{ customers:3, suppliers:2, products:5, invoices:1, purchases:1, warehouseMovements:4, workflowEvents:2, auditEvents:1 }, scenarios:[], events:[] }),
      buildProgressReport: () => ({ groupId:'grp_demo', keyCounters:{ customers:3, products:5 } })
    };
  </script>
  <script src="../js/features/business-groups/teacher-console-module.js"></script>
  <script>
    (async function(){
      window.AppModules.teacherConsole.bind();
      await window.AppModules.teacherConsole.render();
      ok('Card indicatori visibili', document.body.textContent.includes('Indicatori dataset gruppo'));
      ok('Pulsante copia JSON esplicito', document.getElementById('teacher-copy-report').textContent.includes('JSON'));
      ok('JSON tecnico nascosto in details', !!document.querySelector('details#teacher-report-details pre#teacher-progress-report'));
      ok('Details tecnici chiusi di default', document.getElementById('teacher-report-details').open === false);
      ok('Riepilogo leggibile resta visibile', document.body.textContent.includes('Clienti') && document.body.textContent.includes('Prodotti'));
      out.textContent += '\nTest completato.';
    })().catch(e => { out.textContent += '\nERRORE: ' + (e.message || e); throw e; });
  </script>
</body>
</html>
