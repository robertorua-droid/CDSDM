<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CDSDM 0.4.5 - Bilancino gestionale</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">
  <div class="container">
    <h1 class="h3">Test Bilancino gestionale 0.4.5</h1>
    <pre id="out" class="bg-light border rounded p-3"></pre>
  </div>
  <script src="../js/features/accounting/mini-balance-service.js"></script>
  <script>
    const out = document.getElementById('out');
    function assert(name, condition) {
      out.textContent += (condition ? '✅ ' : '❌ ') + name + '\n';
      if (!condition) throw new Error(name);
    }
    const data = {
      invoices: [
        { id:'i1', number:'FT1', date:'2026-01-10', dueDate:'2026-01-31', total:1000, customerId:'c1' },
        { id:'n1', type:'credit_note', number:'NC1', date:'2026-01-12', total:100, customerId:'c1' }
      ],
      purchases: [{ id:'p1', number:'AC1', date:'2026-01-15', dueDate:'2026-02-15', total:300, supplierId:'s1' }],
      customers: [{ id:'c1', name:'Cliente Test' }],
      suppliers: [{ id:'s1', name:'Fornitore Test' }],
      paymentEvents: [
        { id:'pay1', type:'customer_receipt', date:'2026-01-20', amount:400, allocations:[{documentId:'i1', amount:400}] },
        { id:'pay2', type:'supplier_payment', date:'2026-01-22', amount:120, allocations:[{documentId:'p1', amount:120}] }
      ],
      cashbookMovements: [{ id:'m1', date:'2026-01-25', direction:'out', amount:50, category:'spese' }],
      products: [{ id:'prod1', itemType:'product', description:'Prodotto', stockQty:5, purchasePrice:10 }],
      supplierDDTs: [], businessBudgets: []
    };
    const result = window.MiniBalanceService.buildMiniBalance(data, { from:'2026-01-01', to:'2026-01-31', includeManualCashbook:true, includeWarehouse:true });
    assert('ricavi netti = fatture - note credito', result.economic.revenueNet === 900);
    assert('costi netti includono acquisti e prima nota manuale', result.economic.costsNet === 350);
    assert('margine operativo semplificato calcolato', result.economic.operatingMargin === 550);
    assert('saldo finanziario periodo calcolato', result.financial.balance === 230);
    assert('crediti clienti aperti calcolati', result.openItems.customerOpen === 500);
    assert('debiti fornitori aperti calcolati', result.openItems.supplierOpen === 180);
    assert('export CSV disponibile', window.MiniBalanceService.toCsv(result).includes('Margine operativo'));
  </script>
</body>
</html>
