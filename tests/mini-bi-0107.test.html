<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <title>Mini B.I. 0.10.7 - Stabilizzazione QA ruoli</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">
  <h1>Mini B.I. 0.10.7 - Stabilizzazione QA ruoli</h1>
  <div id="mini-bi">
    <select id="mini-bi-year"><option value="all">Tutti</option></select>
    <select id="mini-bi-month"><option value="all">Tutti</option></select>
    <button id="mini-bi-refresh-btn" type="button">Aggiorna</button>
    <div id="mini-bi-overview"></div>
    <button class="btn btn-outline-primary mini-bi-area-tab active" data-area="direzione" type="button">Direzione</button>
    <button class="btn btn-outline-primary mini-bi-area-tab" data-area="vendite" type="button">Vendite</button>
    <button class="btn btn-outline-primary mini-bi-area-tab" data-area="acquisti" type="button">Acquisti</button>
    <button class="btn btn-outline-primary mini-bi-area-tab" data-area="contabilita" type="button">Contabilità</button>
    <button class="btn btn-outline-primary mini-bi-area-tab" data-area="magazzino" type="button">Magazzino</button>
    <button class="btn btn-outline-primary mini-bi-area-tab" data-area="didattica" type="button">Didattica</button>
    <h2 id="mini-bi-area-title"></h2>
    <div id="mini-bi-area-cards"></div>
    <div id="mini-bi-area-details"></div>
    <div id="mini-bi-kpi-catalog"></div>
    <div id="mini-bi-sources"></div>
    <div id="mini-bi-warnings"></div>
    <div id="mini-bi-role-qa"></div>
  </div>
  <pre id="out">Esecuzione...</pre>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script>
    window.globalData={
      invoices:[{id:'i1',date:'2026-01-10',total:1000,customerName:'Cliente A'}],
      notes:[], purchases:[{id:'p1',date:'2026-01-11',total:300,supplierName:'Fornitore A'}],
      products:[{id:'x',name:'Prodotto',stockQty:5,cost:10}], customers:[], suppliers:[], paymentEvents:[],
      customerOrders:[{id:'o1',date:'2026-01-12',status:'open'}], supplierOrders:[{id:'so1',date:'2026-01-12',status:'open'}], customerDDTs:[],
      quotes:[], warehouseMovements:[], warehouseLots:[], businessBudgets:[], teachingScenarios:[], simulationEvents:[]
    };
    window.PermissionsPolicy={
      getCurrentRole:function(){return {id:'admin',label:'Admin'};},
      isAdmin:function(){return true;},
      accessRank:function(l){return {none:0,read:1,write:2,admin:3}[l]||0;},
      getPermissionLevel:function(){return 'admin';},
      canAccessTarget:function(){return true;}
    };
  </script>
  <script src="../js/features/bi/mini-bi-service.js"></script>
  <script src="../js/features/bi/mini-bi-module.js"></script>
  <script>
    const out=[]; function ok(name,cond){out.push((cond?'✅ ':'❌ ')+name); if(!cond) throw new Error(name);}
    const qa=MiniBIService.runRoleRegressionQa();
    ok('QA regressione disponibile', Array.isArray(qa) && qa.length>=8);
    ok('tutti gli scenari base passano', qa.every(r=>r.passed===true));
    const superadmin=qa.find(r=>r.roleId==='superadmin');
    ok('superadmin vede tutte le aree', superadmin.allowedAreas.length===6);
    const sales=qa.find(r=>r.roleId==='sales');
    ok('profilo vendite vede solo vendite', sales.allowedAreas.length===1 && sales.allowedAreas[0]==='vendite');
    const limited=qa.find(r=>r.roleId==='limited');
    ok('profilo limitato non vede aree B.I.', limited.allowedAreas.length===0);
    window.AppModules.miniBI.render();
    ok('pannello QA ruoli renderizzato', document.getElementById('mini-bi-role-qa').textContent.indexOf('QA regressione ruoli')>=0);
    $('.mini-bi-area-tab[data-area="vendite"]').trigger('click');
    ok('tab vendite ancora funzionante dopo QA', document.getElementById('mini-bi-area-title').textContent.indexOf('Vendite')>=0);
    ok('una sola tab attiva', $('.mini-bi-area-tab.active').length===1);
    document.getElementById('out').textContent=out.join('\n');
  </script>
</body>
</html>
