<!doctype html>
<html lang="it"><head><meta charset="utf-8"><title>Workflow operativo 0.12.11</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="p-4"><main class="container"><h1 class="h3">Workflow operativo 0.12.11</h1><div id="out" class="mt-3"></div></main>
<script>
window.globalData = { workflowEvents: [], supplierOrders: [{ id:'10', number:'OF-1', status:'draft', supplierName:'Fornitore A' }], customerOrders: [{ id:'20', number:'OC-1', status:'draft', customerName:'Cliente A' }] };
window.currentUser = { email: 'qa@example.test' };
window.saveLog = [];
window.saveDataToCloud = async function(collection, data, id){ window.saveLog.push({collection,data,id}); if(collection==='workflowEvents') window.globalData.workflowEvents.push(Object.assign({id:id},data)); else { const list = window.globalData[collection] || []; const i = list.findIndex(x => String(x.id) === String(id)); if(i>=0) list[i] = Object.assign({}, list[i], data); else list.push(Object.assign({id:id},data)); window.globalData[collection]=list; } };
</script>
<script src="../js/features/accounting/workflow-service.js"></script>
<script>
(function(){
  const results=[];
  function ok(name, cond){ results.push({name, cond: !!cond}); }
  const supplierTask = window.WorkflowService.buildTasks(window.globalData,{filters:{type:'supplier_order',status:'open'}}).tasks[0];
  window.WorkflowService.applyAction(supplierTask,'approve','ordine verificato').then(function(){
    const savedSupplier = window.saveLog.find(x => x.collection === 'supplierOrders');
    ok('Ordine fornitore approvato diventa confirmed', savedSupplier && savedSupplier.data.status === 'confirmed' && savedSupplier.data.workflowStatus === 'approved');
    const customerTask = window.WorkflowService.buildTasks(window.globalData,{filters:{type:'customer_order',status:'open'}}).tasks[0];
    return window.WorkflowService.applyAction(customerTask,'approve','ordine cliente verificato');
  }).then(function(){
    const savedCustomer = window.saveLog.find(x => x.collection === 'customerOrders');
    ok('Ordine cliente approvato diventa confirmed', savedCustomer && savedCustomer.data.status === 'confirmed' && savedCustomer.data.workflowStatus === 'approved');
    const patch = window.WorkflowService.operationalPatchForAction({sourceType:'supplier_order', doc:{status:'cancelled'}},{statusTo:'approved',createdAt:'2026-01-01T00:00:00Z',createdBy:'qa',note:''});
    ok('Ordine annullato non viene riaperto dal workflow', !patch.status || patch.status !== 'confirmed');
    document.getElementById('out').innerHTML = results.map(r => '<div class="alert '+(r.cond?'alert-success':'alert-danger')+'">'+(r.cond?'✓':'✗')+' '+r.name+'</div>').join('');
  }).catch(function(e){ document.getElementById('out').innerHTML='<div class="alert alert-danger">Errore test: '+e.message+'</div>'; });
})();
</script></body></html>
