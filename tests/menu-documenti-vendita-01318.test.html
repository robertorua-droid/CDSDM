<!doctype html>
<html lang="it">
<head><meta charset="utf-8"><title>CDSDM 0.13.18 - Elenco documenti vendita</title></head>
<body><pre id="output"></pre><script>
async function read(p){ return fetch(p).then(r=>r.text()); }
async function run(){
  const out=document.getElementById('output');
  const index=await read('../index.html');
  const nav=await read('../js/features/navigation/navigation-module.js');
  const doc=await read('../DOCUMENTAZIONE/134_ELENCO_DOCUMENTI_VENDITA_01318.md');
  const checks=[];
  function ok(m,p){ checks.push((p?'✓ ':'✗ ')+m); if(!p) throw new Error(m); }
  ok('versione UI ramo 0.13 corrente', /CDSDM Versione 0\.13\.[0-9]+/.test(index));
  ok('voce menu Elenco documenti vendita presente', index.includes('menu-elenco-documenti-vendita') && index.includes('Elenco documenti vendita'));
  ok('Nuova Fattura legacy nascosta dal menu', index.includes('id="menu-nuova-fattura"') && index.includes('data-menu-legacy="sales-document-action"') && index.includes('menu-legacy-hidden'));
  ok('Nuova Nota Credito legacy nascosta dal menu', index.includes('id="menu-nuova-nota-credito"') && index.includes('data-menu-legacy="sales-document-action"') && index.includes('aria-hidden="true"'));
  ok('pulsante Nuova fattura nella pagina elenco', index.includes('sales-doc-new-invoice-btn'));
  ok('pulsante Nuova nota credito nella pagina elenco', index.includes('sales-doc-new-credit-note-btn'));
  ok('navigation gestisce pulsanti documenti vendita', nav.includes('openSalesDocumentForm') && nav.includes('sales-doc-new-credit-note-btn'));
  ok('documentazione 0.13.18 presente', doc.includes('Elenco documenti vendita'));
  out.textContent=checks.join('\n');
}
run().catch(e=>{ document.getElementById('output').textContent='ERRORE: '+e.message; });
</script></body></html>
