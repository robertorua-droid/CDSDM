<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <title>Coerenza contabile 0.3.7 - Test</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">
  <h1 class="h4">Consolidamento QA 0.3.7 - Coerenza contabile</h1>
  <div id="results" class="mt-3"></div>

  <script>
    window.globalData = {
      customers: [{ id: 'c1', name: 'Cliente Demo' }],
      suppliers: [{ id: 's1', name: 'Fornitore Demo' }],
      invoices: [{ id: 'i1', customerId: 'c1', number: '1', date: '2026-01-10', nettoDaPagare: 100, payments: [] }],
      purchases: [{ id: 'a1', supplierId: 's1', number: 'A1', date: '2026-01-12', totaleDocumento: 80, payments: [] }],
      paymentEvents: [
        { id: 'pe1', subjectType: 'customer', subjectId: 'c1', date: '2026-01-20', amount: 60, allocations: [{ documentType: 'invoice', documentId: 'i1', amount: 60 }] },
        { id: 'pe2', subjectType: 'supplier', subjectId: 's1', date: '2026-01-22', amount: 40, allocations: [{ documentType: 'purchase', documentId: 'a1', amount: 40 }] }
      ],
      cashbookMovements: [],
      bankReconciliationEvents: [{ id: 'br1', paymentEventId: 'pe1' }],
      businessBudgets: [],
      warehouseLots: [],
      reminderEvents: []
    };
    window.getData = function (key) { return window.globalData[key] || []; };
  </script>
  <script src="../js/features/accounting/payment-events-service.js"></script>
  <script src="../js/features/accounting/cashbook-service.js"></script>
  <script src="../js/features/accounting/accounting-consistency-service.js"></script>
  <script>
    const results = document.getElementById('results');
    function assertTrue(condition, message) {
      const div = document.createElement('div');
      div.className = 'alert ' + (condition ? 'alert-success' : 'alert-danger');
      div.textContent = (condition ? 'OK - ' : 'ERRORE - ') + message;
      results.appendChild(div);
      if (!condition) throw new Error(message);
    }

    const clean = window.AccountingConsistencyService.runChecks(window.globalData);
    assertTrue(clean.summary.ok === true, 'dataset coerente senza errori bloccanti');
    assertTrue(clean.summary.warnings === 0, 'nessun warning sul dataset coerente');

    const bad = JSON.parse(JSON.stringify(window.globalData));
    bad.paymentEvents[0].allocations[0].amount = 160;
    const checked = window.AccountingConsistencyService.runChecks(bad, { includeCashbook: false });
    assertTrue(checked.summary.warnings >= 1, 'rileva allocazioni/incassi superiori al documento');
    assertTrue(checked.issues.some(function (i) { return i.code === 'PAYMENT_EVENT_OVERALLOCATED' || i.code === 'INVOICE_OVERPAID'; }), 'codice anomalia contabile presente');

    const collections = window.AccountingConsistencyService.expectedCollections();
    assertTrue(collections.indexOf('paymentEvents') >= 0 && collections.indexOf('businessBudgets') >= 0, 'collezioni 0.2.x/0.3.x presidiate dal QA');
  </script>
</body>
</html>
