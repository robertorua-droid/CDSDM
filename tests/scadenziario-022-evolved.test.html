<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Scadenzario evoluto 0.2.2</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">
  <h1>Scadenzario evoluto 0.2.2</h1>
  <div id="results" class="mt-3"></div>

  <script src="test-harness.js"></script>
  <script src="../js/features/scadenziario/scadenziario-service.js"></script>
  <script>
    (function () {
      const H = window.TestHarness;
      const { assertEquals, assertTrue, assertNear, assertIncludes, report } = H;
      const tests = [];
      function test(name, fn) { tests.push({ name, fn }); }

      test('calcola incassi e pagamenti con residuo parziale', function () {
        const items = window.ScadenziarioService.buildItems({
          customers: [{ id: 'c1', name: 'Cliente Alfa' }],
          suppliers: [{ id: 's1', name: 'Fornitore Beta' }],
          invoices: [{ id: 'i1', customerId: 'c1', number: '1', dataScadenza: '2026-05-10', nettoDaPagare: 1000, payments: [{ amount: 250 }] }],
          purchases: [{ id: 'p1', supplierId: 's1', number: 'A7', dataScadenza: '2026-05-15', totaleDocumento: 400 }]
        }, { from: '2026-05-01', to: '2026-05-31', today: '2026-05-01', filters: { status: 'all', type: 'all' } });
        assertEquals(items.length, 2, 'Devono essere prodotte due scadenze');
        const incasso = items.find(x => x.entity === 'invoice');
        assertEquals(incasso.status, 'Parziale', 'La fattura deve risultare parziale');
        assertNear(incasso.paidAmount, 250, 0.001, 'Incassato non corretto');
        assertNear(incasso.residualAmount, 750, 0.001, 'Residuo non corretto');
      });

      test('filtra scadenze scadute e riepiloga il saldo operativo', function () {
        const items = window.ScadenziarioService.buildItems({
          customers: [{ id: 'c1', name: 'Cliente Alfa' }],
          suppliers: [{ id: 's1', name: 'Fornitore Beta' }],
          invoices: [{ id: 'i1', customerId: 'c1', number: '1', dataScadenza: '2026-04-10', nettoDaPagare: 1000 }],
          purchases: [{ id: 'p1', supplierId: 's1', number: 'A7', dataScadenza: '2026-05-15', totaleDocumento: 300 }]
        }, { from: '2026-04-01', to: '2026-05-31', today: '2026-05-01', filters: { status: 'overdue', type: 'all' } });
        assertEquals(items.length, 1, 'Deve restare solo la scadenza scaduta');
        assertEquals(items[0].entity, 'invoice', 'La scadenza scaduta deve essere cliente');
        const summary = window.ScadenziarioService.summarize(items);
        assertEquals(summary.overdueCount, 1, 'Conteggio scadute non corretto');
        assertNear(summary.customerReceivables, 1000, 0.001, 'Totale da incassare non corretto');
      });

      test('genera patch pagamento compatibile con documento esistente', function () {
        const doc = { id: 'i1', status: 'Da Incassare', nettoDaPagare: 1000, payments: [{ amount: 200 }] };
        const patch = window.ScadenziarioService.buildPaymentPatch(doc, 'invoice', 300, '2026-05-02', 'Acconto');
        assertEquals(patch.status, 'Parziale', 'Lo stato deve restare parziale');
        assertEquals(patch.payments.length, 2, 'Deve aggiungere un evento pagamento');
        assertNear(patch.paidAmount, 500, 0.001, 'Totale pagato non corretto');
        assertTrue(patch.isPaid === false, 'Non deve chiudere la fattura');
        const saldo = window.ScadenziarioService.buildPaymentPatch({ id: 'i2', nettoDaPagare: 100, payments: [] }, 'invoice', 100, '2026-05-02', 'Saldo');
        assertEquals(saldo.status, 'Pagata', 'Il saldo deve chiudere il documento');
        assertTrue(saldo.isPaid === true, 'Documento saldato non marcato come pagato');
      });

      report('results', tests);
    })();
  </script>
</body>
</html>
