<!doctype html>
<html lang="it">
<head><meta charset="utf-8"><title>CDSDM 0.13.7 - Branding logo trasparente</title></head>
<body><pre id="output"></pre><script>
async function read(p){ return fetch(p).then(r=>r.text()); }
function loadImage(src){ return new Promise((resolve,reject)=>{ const i=new Image(); i.onload=()=>resolve(i); i.onerror=reject; i.src=src; }); }
async function run(){
 const out=document.getElementById('output');
 const index=await read('../index.html');
 const css=await read('../css/style.css');
 const doc=await read('../DOCUMENTAZIONE/123_RIFINITURA_BRANDING_LOGO_TRASPARENTE_0137.md');
 const checks=[];
 function ok(m,p){ checks.push((p?'✓ ':'✗ ')+m); if(!p) throw new Error(m); }
 ok('versione UI aggiornata a 0.13.7', index.includes('CDSDM Versione 0.13.7'));
 ok('documentazione 0.13.7 presente', doc.includes('trasparenza reale'));
 ok('micro-rifinitura CSS 0.13.7 presente', css.includes('Branding 0.13.7 — logo trasparente pulito'));
 const img=await loadImage('../assets/branding/brand-mark.png');
 const canvas=document.createElement('canvas'); canvas.width=img.width; canvas.height=img.height;
 const ctx=canvas.getContext('2d'); ctx.drawImage(img,0,0);
 const data=ctx.getImageData(0,0,canvas.width,canvas.height).data;
 let hasTransparent=false;
 for(let i=3;i<data.length;i+=4){ if(data[i]===0){ hasTransparent=true; break; } }
 ok('logo con almeno una zona trasparente reale', hasTransparent);
 out.textContent=checks.join('\n');
}
run().catch(e=>{ document.getElementById('output').textContent='ERRORE: '+e.message; });
</script></body></html>
