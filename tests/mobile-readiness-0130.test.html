<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CDSDM 0.13.0 - Mobile readiness audit</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="p-4 bg-light">
  <main class="container">
    <h1 class="h3">Test 0.13.0 — Mobile readiness audit</h1>
    <p class="text-muted">Verifica statica degli elementi minimi di compatibilità mobile e delle criticità note documentate.</p>
    <pre id="out" class="bg-white border rounded p-3"></pre>
  </main>
  <script>
    const out = document.getElementById('out');
    function log(msg) { out.textContent += msg + '\n'; }
    function ok(label, cond) { log((cond ? '✅ ' : '❌ ') + label); if (!cond) throw new Error(label); }
    async function text(path) {
      const res = await fetch(path);
      if (!res.ok) throw new Error('Impossibile leggere ' + path + ': ' + res.status);
      return res.text();
    }
    (async function(){
      const index = await text('../index.html');
      const css = await text('../css/style.css');
      const docs = await text('../js/features/navigation/docs-content.js');
      const migration = await text('../js/features/migration/migration-module.js');
      const count = (haystack, needle) => (haystack.match(new RegExp(needle.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'g')) || []).length;

      ok('Meta viewport presente in index.html', index.includes('name="viewport"'));
      ok('Bootstrap presente come base responsive', index.includes('bootstrap') || css.includes('Bootstrap'));
      ok('Uso reale di wrapper table-responsive', count(index + docs, 'table-responsive') >= 10);
      ok('Sidebar desktop fissa rilevata e documentata come criticità', css.includes('.sidebar') && (css.includes('252px') || css.includes('260px')));
      ok('Assenza di nuova navigazione mobile dedicata rilevabile', !index.includes('navbar-toggler'));
      ok('Versione in-app corrente almeno 0.13.0', /CDSDM Versione 0\.13\.[0-9]+/.test(index));
      ok('Backup JSON versione ramo 0.13.x', /appVersion: '0\.13\.[0-9]+'/.test(migration));
      ok('Documento audit mobile sincronizzato in docs-content.js', docs.includes('116_MOBILE_READINESS_AUDIT_0130') && docs.includes('Mobile readiness audit 0.13.0'));
      ok('Audit dichiara nessuna nuova collezione Firestore', docs.includes('Nessuna nuova collezione Firestore'));
      ok('Audit classifica compatibilità alta/media/bassa', docs.includes('Compatibilità alta') && docs.includes('Compatibilità media') && docs.includes('Compatibilità bassa'));
      ok('Audit documenta users/{uid} e businessGroups/{groupId}', docs.includes('users/{uid}') && docs.includes('businessGroups/{groupId}'));

      log('\nIndicatori statici:');
      log('- table-responsive rilevati: ' + count(index + docs, 'table-responsive'));
      log('- modal-dialog rilevati: ' + count(index + docs, 'modal-dialog'));
      log('- classi col-md rilevate: ' + count(index + docs, 'col-md'));
      log('\nTest completato: la 0.13.0 resta un audit di readiness mobile, non un redesign.');
    })().catch(e => { log('\nERRORE: ' + (e.message || e)); throw e; });
  </script>
</body>
</html>
