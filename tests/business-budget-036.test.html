<!doctype html>
<html lang="it"><head><meta charset="utf-8"><title>Business Budget 0.3.6</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="p-4"><h1>Budget e marginalità 0.3.6</h1><pre id="out"></pre>
<script>window.globalData=window.globalData||{};</script>
<script src="../js/features/accounting/business-budget-service.js"></script>
<script>
(function(){
  const out=document.getElementById('out');
  function assert(cond,msg){ if(!cond) throw new Error(msg); out.textContent += 'OK - '+msg+'\n'; }
  const data={customers:[{id:'c1',name:'Cliente A'}],suppliers:[{id:'s1',name:'Fornitore A'}],products:[{id:'p1',name:'Servizio X',purchasePrice:30}],invoices:[{id:'i1',date:'2026-01-10',customerId:'c1',totalNet:1000,lines:[{productId:'p1',description:'Servizio X',qty:10,price:100}]}],purchases:[{id:'a1',date:'2026-01-12',supplierId:'s1',totalNet:250}],cashbookMovements:[{id:'m1',date:'2026-01-15',direction:'out',amount:50,category:'Spese'}],businessBudgets:[{id:'budget_2026',year:2026,months:[{month:1,revenueTarget:900,costTarget:200,marginTarget:700}]}]};
  const result=BusinessBudgetService.compareBudget(data,2026);
  assert(result.totals.revenue===1000,'calcola ricavi da fatture');
  assert(result.totals.costs===300,'somma acquisti e costi manuali');
  assert(result.totals.margin===700,'calcola margine lordo');
  assert(result.months[0].revenueDelta===100,'calcola delta ricavi vs budget');
  assert(result.actuals.byCustomer[0].name==='Cliente A','aggrega top clienti');
  assert(result.actuals.byProduct[0].margin===700,'stima marginalità prodotto da costo anagrafico');
})();
</script></body></html>
