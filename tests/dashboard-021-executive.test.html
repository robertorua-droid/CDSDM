<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <title>Dashboard Direzionale 0.2.1</title>
</head>
<body>
  <select id="dash-mode"><option value="year" selected>Annuale</option><option value="month">Mensile</option></select>
  <select id="dash-year"><option value="2026" selected>2026</option></select>
  <select id="dash-month"><option value="01" selected>Gennaio</option></select>
  <div id="dash-month-wrap"></div>
  <button id="dash-refresh-btn"></button>
  <section id="dashboard"></section>
  <div id="dashboard-container"></div>

  <script src="test-harness.js"></script>
  <script>
    window.globalData = {
      customers: [{ id:'c1', name:'Cliente Alfa' }],
      invoices: [
        { id:'i1', type:'Fattura', date:'2026-01-10', customerId:'c1', customerName:'Cliente Alfa', total:1000, dueDate:'2026-01-31', status:'sent' },
        { id:'n1', type:'Nota di Credito', date:'2026-01-12', customerId:'c1', customerName:'Cliente Alfa', total:100, status:'issued' }
      ],
      purchases: [{ id:'p1', date:'2026-01-11', total:300, dueDate:'2026-01-20', status:'Da Pagare' }],
      products: [
        { id:'prod1', itemType:'product', description:'Prodotto A', stockQty:5, quarantineQty:2, purchasePrice:10, minStockQty:5 },
        { id:'prod2', itemType:'product', description:'Prodotto B', stockQty:3, quarantineQty:0, purchasePrice:20, minStockQty:0 }
      ],
      customerDDTs: [
        { id:'d1', number:'DDT-1', date:'2026-01-13', customerName:'Cliente Alfa', status:'issued' },
        { id:'d2', number:'DDT-2', date:'2026-01-14', customerName:'Cliente Alfa', status:'invoiced', invoiceId:'i1' }
      ],
      customerOrders: [{ id:'o1', status:'confirmed' }],
      supplierOrders: [{ id:'so1', status:'partially_received' }],
      worklogs: [
        { id:'w1', date:'2026-01-15', minutes:120, billable:true },
        { id:'w2', date:'2026-01-16', minutes:60, billable:true, invoiceId:'i1' }
      ]
    };
    window.AppStore = { get:function(k){ return window.globalData[k] || []; }, subscribe:function(){ return function(){}; } };
    window.safeFloat = function(v){ var n = parseFloat(String(v || 0).replace(',', '.')); return isNaN(n) ? 0 : n; };
    window.escapeHtml = function(v){ return String(v == null ? '' : v).replace(/[&<>\"]/g, function(m){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[m]; }); };
    window.$ = function(selector){
      var el = document.querySelector(selector);
      return {
        length: el ? 1 : 0,
        val: function(value){ if (!el) return ''; if (value === undefined) return el.value; el.value = value; return this; },
        empty: function(){ if (el) el.innerHTML = ''; return this; },
        append: function(html){ if (el) el.insertAdjacentHTML('beforeend', html); return this; },
        find: function(q){ var found = el ? el.querySelector(q) : null; return { length: found ? 1 : 0 }; },
        show: function(){ if (el) el.style.display = ''; return this; },
        hide: function(){ if (el) el.style.display = 'none'; return this; },
        hasClass: function(cls){ return el ? el.classList.contains(cls) : false; },
        html: function(value){ if (!el) return ''; if (value === undefined) return el.innerHTML; el.innerHTML = value; return this; },
        on: function(){ return this; }
      };
    };
  </script>
  <script src="../js/features/dashboard/executive-dashboard-service.js"></script>
  <script src="../js/ui/dashboard-render.js"></script>
  <script>
    test('servizio dashboard calcola KPI direzionali', function(){
      var s = window.ExecutiveDashboardService.computeDashboardSummary({ start:'2026-01-01', end:'2026-12-31', mode:'year' });
      assertEqual(s.revenue, 900, 'Fatturato netto atteso 1000 - nota credito 100');
      assertEqual(s.purchases, 300, 'Acquisti periodo attesi');
      assertEqual(s.estimatedGrossMargin, 600, 'Margine lordo stimato atteso');
      assertEqual(s.inventory.totalValue, 130, 'Valore magazzino atteso: (5+2)*10 + 3*20');
      assertEqual(s.openCustomerDDTs.length, 1, 'Un solo DDT cliente da fatturare');
      assertEqual(s.openCustomerOrders.length, 1, 'Un ordine cliente aperto');
      assertEqual(s.openSupplierOrders.length, 1, 'Un ordine fornitore aperto');
      assertEqual(s.uninvoicedMinutes, 120, 'Timesheet non fatturato atteso');
    });

    test('render dashboard mostra le sezioni direzionali', function(){
      document.getElementById('dash-year').value = '2026';
      renderDashboardPage();
      var html = document.getElementById('dashboard-container').innerHTML;
      assertIncludes(html, 'Dashboard Direzionale 0.2.1', 'Banner release mancante');
      assertIncludes(html, 'Fatturato netto', 'KPI fatturato mancante');
      assertIncludes(html, 'Margine lordo stimato', 'KPI margine mancante');
      assertIncludes(html, 'DDT cliente da fatturare', 'KPI DDT mancante');
      assertIncludes(html, 'Top clienti per fatturato', 'Tabella top clienti mancante');
      assertIncludes(html, 'DDT-1', 'DDT aperto non renderizzato');
      assertIncludes(html, '2,00 h', 'Ore timesheet non fatturate non renderizzate');
    });

    runTests();
  </script>
</body>
</html>
