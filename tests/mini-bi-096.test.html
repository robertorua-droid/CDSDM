<!doctype html><html lang="it"><head><meta charset="utf-8"><title>CDSDM 0.9.6 - Vista Direzione / Amministrazione</title></head><body><h1>Test 0.9.6 - Vista Direzione / Amministrazione</h1><pre id="output"></pre><script src="../js/core/domain-constants.js"></script><script src="../js/core/app-store.js"></script><script src="../js/features/bi/mini-bi-service.js"></script><script>const out=document.getElementById('output');function ok(l,c){if(!c)throw new Error(l);out.textContent+='✓ '+l+'\n';}async function read(p){return fetch(p).then(r=>r.text());}async function run(){const data={invoices:[{total:200}],notes:[{total:20}],purchases:[{total:80}],products:[{stockQty:2,purchasePrice:5}]}; const a=window.MiniBIService.computeArea('direzione',data,{}); ok('vista Direzione disponibile', a.title.includes('Direzione')); ok('margine stimato calcolato', a.cards.some(c=>c[0].includes('Margine')&&c[2]===100)); ok('warning didattici presenti', Array.isArray(a.warnings)&&a.warnings.length>0);out.textContent+='\nOK 0.9.6';}run().catch(e=>{out.textContent+='\nERRORE: '+e.message;throw e;});</script></body></html>
