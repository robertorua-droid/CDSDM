<!doctype html><html lang="it"><head><meta charset="utf-8"><title>CDSDM 0.9.5 - Vista B.I. Magazzino</title></head><body><h1>Test 0.9.5 - Vista B.I. Magazzino</h1><pre id="output"></pre><script src="../js/core/domain-constants.js"></script><script src="../js/core/app-store.js"></script><script src="../js/features/bi/mini-bi-service.js"></script><script>const out=document.getElementById('output');function ok(l,c){if(!c)throw new Error(l);out.textContent+='✓ '+l+'\n';}async function read(p){return fetch(p).then(r=>r.text());}async function run(){const data={products:[{id:'p1',stockQty:3,purchasePrice:10},{id:'p2',stockQty:0,purchasePrice:5}],customerDDTs:[{status:'emitted'}]}; const a=window.MiniBIService.computeArea('magazzino',data,{}); ok('vista Magazzino disponibile', a.title==='Magazzino'); ok('valore giacenza stimato', a.cards.some(c=>c[0].includes('Valore')&&c[2]===30)); ok('prodotti con giacenza conteggiati', a.cards.some(c=>c[0].includes('giacenza')&&c[2]===1));out.textContent+='\nOK 0.9.5';}run().catch(e=>{out.textContent+='\nERRORE: '+e.message;throw e;});</script></body></html>
