<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <title>CDSDM 0.5.1 - Membri, inviti e ruoli</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="p-4">
  <h1>Test Gruppi aziendali 0.5.1</h1>
  <pre id="results"></pre>
  <div id="business-group-sidebar"></div>
  <select id="business-group-selector"></select>
  <div id="business-groups-root"></div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="../js/core/utils.js"></script>
  <script src="../js/features/business-groups/business-groups-service.js"></script>
  <script src="../js/features/business-groups/business-groups-module.js"></script>
  <script>
    const out = [];
    function ok(name, cond) { out.push((cond ? '✓ ' : '✗ ') + name); if (!cond) throw new Error(name); }

    ok('BusinessGroupsService versione ramo 0.5.x', /^0\.[56]\./.test(window.BusinessGroupsService.VERSION));
    ok('Ruolo teacher disponibile', window.BusinessGroupsService.ROLES.teacher.indexOf('Docente') === 0);
    ok('Descrizioni ruoli disponibili', !!window.BusinessGroupsService.ROLE_DESCRIPTIONS.accounting);
    ok('normalizeRole fallback a readonly', window.BusinessGroupsService.normalizeRole('ruolo_sconosciuto') === 'readonly');
    ok('admin può gestire membri', window.BusinessGroupsService.canManageMembership('admin') === true);
    ok('teacher può gestire membri', window.BusinessGroupsService.canManageMembership('teacher') === true);
    ok('readonly non può gestire membri', window.BusinessGroupsService.canManageMembership('readonly') === false);
    ok('generazione codice invito', /^BG-[A-Z0-9]{4}-[A-Z0-9]{4}$/.test(window.BusinessGroupsService.generateInviteCode()));
    ok('API membri esposte', typeof window.BusinessGroupsService.listMembers === 'function' && typeof window.BusinessGroupsService.addMemberToGroup === 'function' && typeof window.BusinessGroupsService.updateMemberRole === 'function');
    ok('API inviti esposte', typeof window.BusinessGroupsService.createInvite === 'function' && typeof window.BusinessGroupsService.acceptInvite === 'function' && typeof window.BusinessGroupsService.revokeInvite === 'function');

    window.currentBusinessGroup = { id: 'grp_test', name: 'Alfa S.r.l.', role: 'teacher' };
    ok('canManageActiveGroup con ruolo teacher', window.BusinessGroupsService.canManageActiveGroup() === true);
    window.BusinessGroupsService.updateSidebarBadge();
    ok('Sidebar mostra ruolo Docente', document.getElementById('business-group-sidebar').textContent.includes('Docente'));

    ok('Modulo UI render esposto', window.AppModules && window.AppModules.businessGroups && typeof window.AppModules.businessGroups.render === 'function');
    document.getElementById('results').textContent = out.join('\n') + '\n\nTutti i controlli statici membri/inviti 0.5.x superati.';
  </script>
</body>
</html>
